name: Publish to npm

on:
  push:
    tags:
      - 'v*' # Triggers on versions like v0.1.18, v1.0.0, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required because your build script clones the gemini-cli submodule
          submodules: recursive 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Publish Package
        run: npm run publish:bridge-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

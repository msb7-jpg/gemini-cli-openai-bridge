name: Publish to npm

on:
  push:
    tags:
      - 'v*' # Triggers on versions like v0.1.18, v1.0.0, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required because your build script clones the gemini-cli submodule
          submodules: recursive 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x' # Matches your package.json engine requirements
          registry-url: 'https://registry.npmjs.org'

      - name: Publish Package
        # This will run your existing prepare, build, and publish scripts
        run: npm run publish:bridge-server
        env:
          # setup-node automatically configures npm to use this env var for authentication
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
